<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="82%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowLeft" cx="15%" cy="20%" r="38%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .pulse-dot {
      animation: pulseLed 2.2s infinite ease-in-out;
      transform-origin: center;
    }
    .orbit-slow {
      animation: spinOrbit 38s linear infinite;
      transform-origin: 960px 155px;
    }
    .orbit-reverse {
      animation: spinOrbitRev 26s linear infinite;
      transform-origin: 960px 155px;
    }
    .twinkle-1 {
      animation: twinkle 3.2s infinite ease-in-out;
    }
    .twinkle-2 {
      animation: twinkle 4.5s infinite ease-in-out 1.1s;
    }
    .twinkle-3 {
      animation: twinkle 2.8s infinite ease-in-out 0.6s;
    }
    .scanline {
      animation: scanMove 8s linear infinite;
    }
    @keyframes pulseLed {
      0%, 100% { opacity: 1; r: 4.5px; }
      50% { opacity: 0.35; r: 6.5px; }
    }
    @keyframes spinOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinOrbitRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }
    @keyframes scanMove {
      0% { transform: translateY(-320px); }
      100% { transform: translateY(320px); }
    }
  </style>

  <!-- Main Card Background -->
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#cyberGrid)"/>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#glowLeft)"/>

  <!-- Subtle Horizontal Accent Lines -->
  <line x1="60" y1="262" x2="1140" y2="262" stroke="#1E293B" stroke-width="1"/>
  <line x1="60" y1="262" x2="420" y2="262" stroke="url(#accentGrad)" stroke-width="1.5"/>

  <!-- 3D Particle Sphere & Network Homage on Right -->
  <g class="orbit-slow">
    <circle cx="960" cy="155" r="108" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.22" stroke-dasharray="6 8"/>
    <circle cx="960" cy="155" r="78" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.28" stroke-dasharray="18 10"/>
    <circle cx="960" cy="47" r="3.5" fill="#38BDF8" filter="url(#softGlow)"/>
    <circle cx="1068" cy="155" r="3" fill="#34D399" filter="url(#softGlow)"/>
    <circle cx="852" cy="155" r="2.5" fill="#818CF8"/>
    <circle cx="960" cy="263" r="3" fill="#38BDF8"/>
  </g>

  <g class="orbit-reverse">
    <ellipse cx="960" cy="155" rx="128" ry="52" fill="none" stroke="#34D399" stroke-width="0.9" stroke-opacity="0.2" stroke-dasharray="4 6" transform="rotate(-28 960 155)"/>
    <ellipse cx="960" cy="155" rx="128" ry="52" fill="none" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.22" stroke-dasharray="10 8" transform="rotate(32 960 155)"/>
    <circle cx="960" cy="155" r="46" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2 5"/>
  </g>

  <!-- Particle Cloud Nodes (3D WebGL Portfolio Homage) -->
  <g class="twinkle-1" fill="#38BDF8">
    <circle cx="885" cy="95" r="1.8"/><circle cx="910" cy="82" r="2.2"/><circle cx="945" cy="72" r="1.6"/>
    <circle cx="980" cy="76" r="2.0"/><circle cx="1012" cy="92" r="1.7"/><circle cx="1035" cy="118" r="2.3"/>
    <circle cx="1042" cy="152" r="1.9"/><circle cx="1030" cy="188" r="2.1"/><circle cx="1005" cy="215" r="1.5"/>
    <circle cx="968" cy="228" r="2.2"/><circle cx="930" cy="222" r="1.8"/><circle cx="898" cy="202" r="2.0"/>
    <circle cx="878" cy="170" r="1.7"/><circle cx="874" cy="132" r="2.1"/><circle cx="790" cy="65" r="1.5"/>
    <circle cx="1115" cy="78" r="1.8"/><circle cx="1135" cy="215" r="1.6"/>
  </g>

  <g class="twinkle-2" fill="#34D399">
    <circle cx="920" cy="115" r="2.0"/><circle cx="955" cy="105" r="2.5"/><circle cx="990" cy="115" r="1.8"/>
    <circle cx="1010" cy="145" r="2.2"/><circle cx="998" cy="180" r="1.9"/><circle cx="965" cy="195" r="2.4"/>
    <circle cx="928" cy="185" r="1.7"/><circle cx="908" cy="150" r="2.1"/><circle cx="960" cy="155" r="3.2" filter="url(#softGlow)"/>
    <circle cx="830" cy="110" r="1.6"/><circle cx="1090" cy="140" r="1.9"/>
  </g>

  <g class="twinkle-3" fill="#A5B4FC">
    <circle cx="940" cy="135" r="1.8"/><circle cx="978" cy="135" r="2.1"/><circle cx="982" cy="168" r="1.8"/>
    <circle cx="942" cy="168" r="2.0"/><circle cx="960" cy="128" r="1.5"/><circle cx="960" cy="182" r="1.5"/>
    <circle cx="848" cy="218" r="1.7"/><circle cx="1072" cy="96" r="2.0"/><circle cx="745" cy="190" r="1.4"/>
  </g>

  <!-- Network Constellation Lines -->
  <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="0.8">
    <line x1="920" y1="115" x2="955" y2="105"/>
    <line x1="955" y1="105" x2="990" y2="115"/>
    <line x1="990" y1="115" x2="1010" y2="145"/>
    <line x1="1010" y1="145" x2="998" y2="180"/>
    <line x1="998" y1="180" x2="965" y2="195"/>
    <line x1="965" y1="195" x2="928" y2="185"/>
    <line x1="928" y1="185" x2="908" y2="150"/>
    <line x1="908" y1="150" x2="920" y2="115"/>
    <line x1="960" y1="155" x2="920" y2="115"/>
    <line x1="960" y1="155" x2="990" y2="115"/>
    <line x1="960" y1="155" x2="998" y2="180"/>
    <line x1="960" y1="155" x2="928" y2="185"/>
  </g>

  <!-- Top Telemetry Status Pill -->
  <rect x="60" y="34" width="545" height="30" rx="15" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <circle cx="80" cy="49" r="4.5" fill="#10B981" class="pulse-dot"/>
  <text x="95" y="53" class="font-mono" font-size="11.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
    SYSTEM ONLINE · <tspan fill="#38BDF8">TÜRKSAT A.Ş.</tspan> SYSTEMS &amp; NETWORK · ANKARA / KONYA
  </text>

  <!-- Main Name / Identity -->
  <text x="60" y="132" class="font-sans" font-size="56" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1.2">
    OKAN YÖRÜK
  </text>

  <!-- Bilingual Subtitle EN -->
  <text x="60" y="174" class="font-sans" font-size="19.5" font-weight="600" fill="#38BDF8" letter-spacing="0.2">
    Software &amp; Systems Engineer <tspan fill="#475569"> · </tspan> <tspan fill="#E2E8F0">Full-Stack, Mobile &amp; AI Developer</tspan>
  </text>

  <!-- Bilingual Subtitle TR -->
  <text x="60" y="204" class="font-sans" font-size="15.5" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
    Bilgisayar Mühendisi Adayı (NEÜ) &amp; Türksat A.Ş. Sistem ve Ağ Yönetimi · Uçtan Uca Yazılım Mimarisi
  </text>

  <!-- Bottom Telemetry Bar -->
  <text x="60" y="290" class="font-mono" font-size="12" fill="#64748B" letter-spacing="0.4">
    <tspan fill="#34D399">▸</tspan> INFRASTRUCTURE: <tspan fill="#CBD5E1">AD DS · DNS/DHCP · GPO · RBAC · Linux/WinServer</tspan>
    <tspan dx="18" fill="#38BDF8">▸</tspan> STACK: <tspan fill="#CBD5E1">Next.js · FastAPI · Flutter · C++/Qt · PyTorch</tspan>
    <tspan dx="18" fill="#818CF8">▸</tspan> 3D ENGINE: <tspan fill="#38BDF8">22K WebGL Particles</tspan>
  </text>
</svg>
